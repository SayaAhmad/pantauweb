[package]
description = "Pantau - pemantauan ketersediaan website, port, dan layanan server."
entrypoint = "serve"

[dependencies]
# php/php-eh dipakai karena build `php/php` tidak memuat pdo_mysql dan curl.
# php-eh adalah runtime resmi Wasmer yang dipakai template WordPress Edge.
"php/php-eh" = "=8.3.404-beta.8"

# Wasmer hanya memetakan direktori, bukan file tunggal. Karena itu direktori
# `wasmer/` dipetakan ke /app (berisi console.php dan stub composer.json),
# lalu direktori runtime Laravel dipetakan di atasnya.
[fs]
"/app" = "wasmer"
"/app/app" = "app"
"/app/bootstrap" = "bootstrap"
"/app/config" = "config"
"/app/database/migrations" = "database/migrations"
"/app/database/seeders" = "database/seeders"
"/app/lang" = "lang"
"/app/public" = "public"
"/app/resources" = "resources"
"/app/routes" = "routes"
"/app/storage" = "storage"
"/app/vendor" = "vendor"

[[command]]
name = "serve"
module = "php/php-eh:php"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "-d", "memory_limit=256M",
    "-d", "max_execution_time=600",
    "-d", "upload_max_filesize=32M",
    "-d", "post_max_size=36M",
    "-t", "/app/public",
    "-S", "localhost:8080",
]

# Dipakai oleh Wasmer Jobs (pantau:deploy, monitors:dispatch, rollup, prune).
[[command]]
name = "artisan"
module = "php/php-eh:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-d", "memory_limit=256M", "-d", "max_execution_time=0", "/app/console.php"]
